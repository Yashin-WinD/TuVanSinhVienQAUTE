# ====================================================================
# HỆ THỐNG TƯ VẤN SINH VIÊN QAUTE (UTE CONSULTING PORTAL)
# File cấu hình chính: application.properties
# ====================================================================

# Cấu hình Server
server.port=8088
server.servlet.context-path=/

# Tên ứng dụng
spring.application.name=qaute-db

# Cấu hình cơ sở dữ liệu MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/qaute_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=bao123456

# Cấu hình JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Giới hạn dung lượng tệp tin tải lên (Multipart & Tomcat Swallow Size - Tối đa 200MB)
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=250MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB

# Ngăn Devtools restart khi lưu trữ file vào thư mục uploads
spring.devtools.restart.exclude=static/**,public/**,uploads/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.pdf,**/*.doc,**/*.docx,**/*.xls,**/*.xlsx

# Cấu hình giao diện Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Cấu hình gửi Mail OTP qua Google SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lebao2006dh@gmail.com
spring.mail.password=qxla daoi eddj qqiq
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


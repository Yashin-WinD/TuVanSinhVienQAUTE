<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Không tìm thấy trang - 404')}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container py-5 text-center my-auto">
        <div class="display-1 text-warning fw-bold">404</div>
        <h2 class="fw-bold mb-3">Không Tìm Thấy Trang</h2>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Trang hoặc dữ liệu bạn yêu cầu không tồn tại.'}">Nội dung lỗi</p>
        <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-house-door me-1"></i>Trở về trang chủ</a>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Lỗi hệ thống - 500')}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container py-5 text-center my-auto">
        <div class="display-1 text-danger fw-bold">500</div>
        <h2 class="fw-bold mb-3">Lỗi Xử Lý Hệ Thống</h2>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Đã có lỗi xảy ra trong quá trình xử lý yêu cầu của bạn.'}">Nội dung lỗi</p>
        <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-arrow-clockwise me-1"></i>Về trang chủ</a>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>

</html>

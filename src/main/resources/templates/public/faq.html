<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Tra cứu câu hỏi thường gặp FAQ - QAUTE')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 flex-grow-1">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-primary">Kho Câu Hỏi Thường Gặp (FAQ)</h2>
            <p class="text-muted">Tìm kiếm câu trả lời nhanh chóng cho các vấn đề thường gặp tại HCMUTE</p>
            
            <!-- Thanh tìm kiếm -->
            <div class="row justify-content-center mt-4">
                <div class="col-md-7">
                    <form th:action="@{/faq}" method="get" class="input-group input-group-lg shadow-sm">
                        <input type="text" name="keyword" th:value="${searchKeyword}" class="form-control" 
                               placeholder="Nhập từ khóa cần tìm (học bổng, rèn luyện, đăng ký môn...)">
                        <button class="btn btn-primary px-4" type="submit"><i class="bi bi-search me-1"></i>Tìm kiếm</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Lọc theo lĩnh vực -->
            <div class="col-md-3 mb-4">
                <div class="card card-custom p-3">
                    <h6 class="fw-bold text-primary mb-3"><i class="bi bi-filter me-1"></i>Lọc theo lĩnh vực</h6>
                    <div class="list-group list-group-flush">
                        <a th:href="@{/faq}" class="list-group-item list-group-item-action fw-semibold">Tất cả lĩnh vực</a>
                        <a th:each="f : ${fields}" th:href="@{/faq(fieldId=${f.id})}" 
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                           th:text="${f.name}">Lĩnh vực</a>
                    </div>
                </div>
            </div>

            <!-- Danh sách FAQ -->
            <div class="col-md-9">
                <div th:if="${#lists.isEmpty(faqs)}" class="alert alert-info text-center py-4">
                    <i class="bi bi-info-circle fs-3 d-block mb-2"></i>
                    Không tìm thấy câu hỏi FAQ nào phù hợp với từ khóa của bạn.
                </div>

                <div class="accordion shadow-sm" id="faqAccordion">
                    <div class="accordion-item" th:each="faq, stat : ${faqs}">
                        <h2 class="accordion-header" th:id="'faqH' + ${faq.id}">
                            <button class="accordion-button" th:classappend="${stat.index != 0 ? 'collapsed' : ''}" 
                                    type="button" data-bs-toggle="collapse" th:data-bs-target="'#faqC' + ${faq.id}">
                                <div class="d-flex align-items-center w-100 justify-content-between pe-3">
                                    <span><i class="bi bi-patch-question text-primary me-2"></i><strong th:text="${faq.question}"></strong></span>
                                    <span class="badge bg-light text-secondary small" th:if="${faq.field != null}" th:text="${faq.field.name}"></span>
                                </div>
                            </button>
                        </h2>
                        <div th:id="'faqC' + ${faq.id}" class="accordion-collapse collapse" 
                             th:classappend="${stat.index == 0 ? 'show' : ''}" data-bs-parent="#faqAccordion">
                            <div class="accordion-body text-secondary" th:utext="${faq.answer}">
                                Câu trả lời
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>

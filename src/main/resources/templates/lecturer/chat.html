<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Phòng chat tư vấn với Sinh viên - QAUTE')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar-lecturer :: sidebar('dashboard')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <h4 class="fw-bold text-primary mb-0">
                            <i class="bi bi-chat-dots-fill me-2"></i>Trao Đổi Trực Tuyến Với Sinh Viên
                        </h4>
                        <small class="text-muted">Phiếu tư vấn: <strong th:text="${request.title}">Tiêu đề</strong></small>
                    </div>
                    <a th:href="@{/lecturer/requests/{id}/answer(id=${request.id})}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Về biểu mẫu trả lời
                    </a>
                </div>

                <div class="chat-container">
                    <div class="chat-header">
                        <div class="d-flex align-items-center gap-3">
                            <img th:src="${request.student.avatarUrl != null ? request.student.avatarUrl : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" 
                                 class="avatar-circle border" alt="Avatar">
                            <div>
                                <h6 class="mb-0 fw-bold" th:text="${request.student.fullName}">Tên Sinh viên</h6>
                                <small class="text-muted">MSSV: <span th:text="${request.student.userCode}">MSSV</span> | Email: <span th:text="${request.student.email}">Email</span></small>
                            </div>
                        </div>
                        <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-1 rounded-pill">
                            <i class="bi bi-lightning-charge-fill me-1"></i>Kênh STOMP Realtime
                        </span>
                    </div>

                    <div class="chat-messages" id="chatMessages">
                        <div th:each="msg : ${messages}" 
                             class="message-item" 
                             th:classappend="${msg.sender.id == currentUser.id ? 'outgoing' : 'incoming'}">
                            <img th:src="${msg.sender.avatarUrl != null ? msg.sender.avatarUrl : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" 
                                 class="avatar-circle" alt="Avatar">
                            <div>
                                <div class="small text-muted mb-1" th:classappend="${msg.sender.id == currentUser.id ? 'text-end' : ''}">
                                    <strong th:text="${msg.sender.fullName}">Người gửi</strong>
                                </div>
                                <div class="message-bubble">
                                    <div th:text="${msg.content}">Nội dung</div>
                                    <div th:if="${msg.mediaUrl != null}" class="mt-2">
                                        <a th:href="${msg.mediaUrl}" target="_blank">
                                            <img th:src="${msg.mediaUrl}" class="message-image" alt="Đính kèm">
                                        </a>
                                    </div>
                                    <div class="message-time" th:text="${#temporals.format(msg.sentAt, 'HH:mm')}">12:00</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="chat-footer">
                        <label for="chatFileInput" class="btn btn-outline-secondary rounded-circle" title="Gửi tệp/ảnh">
                            <i class="bi bi-image"></i>
                        </label>
                        <input type="file" id="chatFileInput" accept="image/*" style="display: none;">

                        <input type="text" id="messageInput" class="form-control chat-input" 
                               placeholder="Nhập nội dung tư vấn gửi sinh viên..." autofocus>

                        <button type="button" id="btnSendMessage" class="btn-send">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const consultationId = /*[[${request.id}]]*/ 1;
        const currentUserId = /*[[${currentUser.id}]]*/ 1;
        const currentUserName = /*[[${currentUser.fullName}]]*/ 'Giảng viên';
        const currentUserAvatar = /*[[${currentUser.avatarUrl}]]*/ '';
        const currentUserRole = /*[[${currentUser.role.name()}]]*/ 'ROLE_LECTURER';

        document.addEventListener('DOMContentLoaded', function () {
            initChat(consultationId, currentUserId, currentUserName, currentUserAvatar, currentUserRole);
        });
        /*]]>*/
    </script>
</body>
</html>

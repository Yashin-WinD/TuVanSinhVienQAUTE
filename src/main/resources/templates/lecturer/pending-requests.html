<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Câu hỏi chờ tiếp nhận - QAUTE')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar-lecturer :: sidebar('pending')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold text-primary mb-1">
                            <i class="bi bi-inbox-fill me-2"></i>Câu Hỏi Chờ Tiếp Nhận (Khoa: <span th:text="${currentUser.department != null ? currentUser.department.name : 'Chung'}">Khoa</span>)
                        </h4>
                        <p class="text-muted mb-0 small">Các câu hỏi mới gửi từ sinh viên thuộc lĩnh vực quản lý của đơn vị</p>
                    </div>
                </div>

                <div class="card card-custom">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Mã số</th>
                                        <th>Sinh viên gửi</th>
                                        <th>Lĩnh vực</th>
                                        <th>Tiêu đề câu hỏi</th>
                                        <th>Mức ưu tiên</th>
                                        <th>Thời gian gửi</th>
                                        <th>Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${pendingPage == null or #lists.isEmpty(pendingPage.content)}">
                                        <td colspan="7" class="text-center py-4 text-muted">Hiện tại không có câu hỏi mới nào đang chờ tiếp nhận.</td>
                                    </tr>
                                    <tr th:if="${pendingPage != null}" th:each="r : ${pendingPage.content}">
                                        <td><strong th:text="'#' + ${r.id}">#1</strong></td>
                                        <td>
                                            <div class="fw-semibold" th:text="${r.student.fullName}">Sinh viên</div>
                                            <small class="text-muted" th:text="${r.student.userCode}">MSSV</small>
                                        </td>
                                        <td><span class="badge bg-light text-dark" th:text="${r.field.name}">Lĩnh vực</span></td>
                                        <td class="fw-semibold text-primary" th:text="${r.title}">Tiêu đề</td>
                                        <td>
                                            <span class="badge" th:classappend="'badge-priority-' + ${r.priority.name()}" th:text="${r.priority.displayName}">Bình thường</span>
                                        </td>
                                        <td th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</td>
                                        <td>
                                            <form th:action="@{/lecturer/requests/{id}/claim(id=${r.id})}" method="post">
                                                <button type="submit" class="btn btn-sm btn-success">
                                                    <i class="bi bi-hand-index-thumb me-1"></i>Tiếp nhận tư vấn
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>

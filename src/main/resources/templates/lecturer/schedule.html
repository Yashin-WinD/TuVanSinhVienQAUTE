<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Lịch hẹn tư vấn - QAUTE')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar-lecturer :: sidebar('schedule')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-primary mb-0"><i class="bi bi-calendar-event me-2"></i>Quản Lý Lịch Hẹn Tư Vấn</h4>
                </div>

                <!-- Alert Thông báo -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="row g-4">
                    <!-- Danh sách các cuộc hẹn -->
                    <div class="col-lg-8">
                        <div class="card card-custom">
                            <div class="card-header card-header-custom">
                                <span class="fs-5"><i class="bi bi-calendar-check me-2 text-primary"></i>Danh sách các cuộc hẹn sắp tới</span>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Sinh viên</th>
                                                <th>Thời gian hẹn</th>
                                                <th>Địa điểm / Link Meet</th>
                                                <th>Ghi chú</th>
                                                <th>Trạng thái</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:if="${#lists.isEmpty(appointments)}">
                                                <td colspan="5" class="text-center py-4 text-muted">Chưa có lịch hẹn tư vấn nào.</td>
                                            </tr>
                                            <tr th:each="apt : ${appointments}">
                                                <td>
                                                    <div class="fw-semibold" th:text="${apt.student.fullName}">Tên SV</div>
                                                    <small class="text-muted" th:text="${apt.student.userCode}">MSSV</small>
                                                </td>
                                                <td>
                                                    <strong class="text-primary" th:text="${#temporals.format(apt.meetingTime, 'dd/MM/yyyy HH:mm')}">Thời gian</strong>
                                                </td>
                                                <td>
                                                    <span th:text="${apt.locationOrLink}">Địa điểm</span>
                                                </td>
                                                <td th:text="${apt.note != null ? apt.note : '-'}">-</td>
                                                <td>
                                                    <span class="badge bg-primary" th:text="${apt.status.displayName}">Đã lên lịch</span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tạo cuộc hẹn mới -->
                    <div class="col-lg-4">
                        <div class="card card-custom p-4 shadow-sm">
                            <h5 class="fw-bold text-primary mb-3"><i class="bi bi-plus-circle me-1"></i>Đặt Lịch Hẹn Mới</h5>
                            <form th:action="@{/lecturer/schedule}" th:object="${appointmentDto}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Phiếu tư vấn</label>
                                    <input type="number" class="form-control" list="lecturerRequestList" th:field="*{consultationId}" placeholder="Chọn hoặc nhập mã phiếu (vd: 1)" required>
                                    <datalist id="lecturerRequestList" th:if="${lecturerRequests != null}">
                                        <option th:each="req : ${lecturerRequests}" th:value="${req.id}" th:text="${'#' + req.id + ' - ' + req.student.fullName + ': ' + req.title}"></option>
                                    </datalist>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Thời gian hẹn</label>
                                    <input type="datetime-local" class="form-control" id="meetingTimeInput" th:field="*{meetingTime}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Địa điểm / Link phòng họp</label>
                                    <input type="text" class="form-control" th:field="*{locationOrLink}" 
                                           placeholder="vd: Văn phòng Khoa A1-205 hoặc meet.google.com/xyz..." required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Ghi chú dặn dò</label>
                                    <textarea class="form-control" th:field="*{note}" rows="3" placeholder="Mang theo bảng điểm, CCCD hoặc tài liệu liên quan..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold">Tạo Lịch Hẹn & Thông Báo</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const meetingTimeInput = document.getElementById("meetingTimeInput");
            if (meetingTimeInput) {
                // Khóa không cho chọn ngày giờ trong quá khứ trên giao diện
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                meetingTimeInput.min = now.toISOString().slice(0, 16);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="scripts">
        <!-- Bootstrap 5 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- SockJS and STOMP for Realtime Chat -->
        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
        <!-- Chat Realtime Script -->
        <script th:src="@{/js/chat.js}"></script>
        <!-- Anti-spam / Anti-double-submit script for all forms -->
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                document.querySelectorAll("form").forEach(function (form) {
                    form.addEventListener("submit", function (e) {
                        if (typeof form.checkValidity === "function" && !form.checkValidity()) {
                            return;
                        }
                        if (form.getAttribute("data-submitting") === "true") {
                            e.preventDefault();
                            return false;
                        }

                        // Đánh dấu form đang submit
                        form.setAttribute("data-submitting", "true");

                        const submitBtn = form.querySelector("button[type='submit'], input[type='submit']");
                        if (submitBtn) {
                            setTimeout(function () {
                                submitBtn.disabled = true;
                                if (submitBtn.tagName === "BUTTON") {
                                    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Đang xử lý...';
                                }
                            }, 50);
                        }
                    });
                });

                // Mở lại nút khi người dùng back lại trang (bfcache)
                window.addEventListener("pageshow", function () {
                    document.querySelectorAll("form").forEach(function (form) {
                        form.removeAttribute("data-submitting");
                        const submitBtn = form.querySelector("button[type='submit'], input[type='submit']");
                        if (submitBtn) {
                            submitBtn.disabled = false;
                        }
                    });
                });
            });
        </script>
    </div>
</body>

</html>

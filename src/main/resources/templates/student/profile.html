<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Hồ sơ cá nhân - QAUTE')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar-student :: sidebar('profile')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="row g-4" style="max-width: 900px; margin: 0 auto;">
                    <!-- Thông tin cá nhân & Avatar -->
                    <div class="col-md-7">
                        <div class="card card-custom p-4">
                            <h5 class="fw-bold text-primary mb-3"><i class="bi bi-person-bounding-box me-2"></i>Thông Tin Sinh Viên</h5>
                            <form th:action="@{/student/profile}" method="post" enctype="multipart/form-data">
                                <div class="text-center mb-3 position-relative">
                                    <img id="avatarPreview" th:src="${currentUser.avatarUrl != null ? currentUser.avatarUrl : 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" 
                                         class="avatar-circle-lg mb-2 shadow-sm border border-2 border-primary" alt="Avatar">
                                    <div class="small text-muted">Ảnh đại diện hiện tại</div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold"><i class="bi bi-camera-fill me-1"></i>Đổi ảnh đại diện</label>
                                    <input type="file" id="avatarFileInput" name="avatarFile" class="form-control" accept="image/png, image/jpeg, image/jpg, image/webp">
                                    <div class="form-text">Hỗ trợ JPG, PNG, WEBP (Tối đa 10MB). Xem trước ngay sau khi chọn.</div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Mã số sinh viên (MSSV)</label>
                                    <input type="text" class="form-control" th:value="${currentUser.userCode}" disabled>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Tên đăng nhập</label>
                                    <input type="text" class="form-control" th:value="${currentUser.username}" disabled>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email sinh viên</label>
                                    <input type="email" class="form-control" th:value="${currentUser.email}" disabled>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Họ và tên</label>
                                    <input type="text" name="fullName" class="form-control" th:value="${currentUser.fullName}" required>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Số điện thoại</label>
                                    <input type="tel" name="phone" class="form-control" th:value="${currentUser.phone}">
                                </div>

                                <button type="submit" class="btn btn-primary w-100 fw-bold">Lưu Thay Đổi</button>
                            </form>
                        </div>
                    </div>

                    <!-- Đổi mật khẩu -->
                    <div class="col-md-5">
                        <div class="card card-custom p-4">
                            <h5 class="fw-bold text-dark mb-3"><i class="bi bi-shield-lock-fill me-2"></i>Đổi Mật Khẩu</h5>
                            <form th:action="@{/student/change-password}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Mật khẩu hiện tại</label>
                                    <input type="password" name="oldPassword" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Mật khẩu mới</label>
                                    <input type="password" name="newPassword" class="form-control" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                                    <input type="password" name="confirmPassword" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-warning w-100 fw-bold">Cập Nhật Mật Khẩu</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>

    <script>
        document.getElementById('avatarFileInput')?.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 10 * 1024 * 1024) {
                    alert('Dung lượng tệp vượt quá giới hạn 10MB! Vui lòng chọn ảnh nhỏ hơn.');
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const preview = document.getElementById('avatarPreview');
                    if (preview) {
                        preview.src = evt.target.result;
                    }
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Lịch sử câu hỏi tư vấn - QAUTE')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar-student :: sidebar('requests')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-primary mb-0"><i class="bi bi-journal-text me-2"></i>Lịch Sử Câu Hỏi Tư Vấn</h4>
                    <a th:href="@{/student/requests/create}" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg me-1"></i>Đặt câu hỏi mới
                    </a>
                </div>

                <div class="card card-custom">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Mã số</th>
                                        <th>Tiêu đề câu hỏi</th>
                                        <th>Khoa / Lĩnh vực</th>
                                        <th>Người tiếp nhận</th>
                                        <th>Trạng thái</th>
                                        <th>Ngày gửi</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(requestsPage.content)}">
                                        <td colspan="7" class="text-center py-4 text-muted">Chưa có câu hỏi tư vấn nào.</td>
                                    </tr>
                                    <tr th:each="r : ${requestsPage.content}">
                                        <td><strong th:text="'#' + ${r.id}">#1</strong></td>
                                        <td>
                                            <a th:href="@{/student/requests/{id}(id=${r.id})}" class="fw-semibold text-decoration-none text-primary" th:text="${r.title}">Tiêu đề</a>
                                        </td>
                                        <td>
                                            <span class="badge bg-light text-dark" th:text="${r.field.department.code + ' - ' + r.field.name}">Khoa</span>
                                        </td>
                                        <td>
                                            <span th:if="${r.lecturer != null}" th:text="${r.lecturer.fullName}">Tên GV</span>
                                            <span th:if="${r.lecturer == null}" class="text-muted fst-italic">Đang phân công</span>
                                        </td>
                                        <td>
                                            <span class="badge" th:classappend="'badge-status-' + ${r.status.name()}" th:text="${r.status.displayName}">Trạng thái</span>
                                        </td>
                                        <td th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</td>
                                        <td>
                                            <a th:href="@{/student/requests/{id}(id=${r.id})}" class="btn btn-sm btn-outline-primary me-1" title="Chi tiết">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <a th:href="@{/student/chat/{id}(id=${r.id})}" class="btn btn-sm btn-outline-success" title="Chat trực tiếp">
                                                <i class="bi bi-chat-dots-fill"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>

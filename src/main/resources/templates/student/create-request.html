<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đặt câu hỏi tư vấn - QAUTE')}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar-student :: sidebar('create')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="card card-custom p-4 shadow-sm" style="max-width: 900px; margin: 0 auto;">
                    <div class="border-bottom pb-3 mb-4">
                        <h4 class="fw-bold text-primary mb-1"><i class="bi bi-question-circle-fill me-2"></i>Gửi Yêu Cầu Tư Vấn Mới</h4>
                        <p class="text-muted mb-0 small">Điền đầy đủ thông tin để Ban Cố Vấn có thể hỗ trợ bạn chính xác và nhanh nhất</p>
                    </div>

                    <div th:if="${errorMessage != null}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/student/requests/create}" th:object="${createDto}" method="post" enctype="multipart/form-data">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Lĩnh vực cần tư vấn <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{fieldId}" required>
                                    <option value="">-- Chọn Khoa / Lĩnh vực tư vấn --</option>
                                    <option th:each="f : ${fields}" th:value="${f.id}" 
                                            th:text="${f.department.code + ' - ' + f.name}"></option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Mức độ ưu tiên</label>
                                <select class="form-select" th:field="*{priority}">
                                    <option value="LOW">Thấp</option>
                                    <option value="MEDIUM" selected>Bình thường</option>
                                    <option value="HIGH">Quan trọng</option>
                                    <option value="URGENT">Khẩn cấp</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Tiêu đề câu hỏi <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{title}" 
                                       placeholder="Tóm tắt ngắn gọn vấn đề (vd: Xin chuyển lớp học phần, phúc khảo điểm...)" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Nội dung chi tiết <span class="text-danger">*</span></label>
                                <textarea class="form-control" th:field="*{content}" rows="6" 
                                          placeholder="Mô tả cụ thể thắc mắc, hoàn cảnh, mã môn học, thời khóa biểu hoặc vấn đề bạn đang gặp phải..." required></textarea>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Ảnh minh chứng / Giấy tờ liên quan (Tải lên Cloudinary)</label>
                                <input type="file" name="evidenceFile" class="form-control" accept="image/*,.pdf">
                                <div class="form-text">Hỗ trợ các định dạng: JPG, PNG, PDF (Tối đa 10MB). Tệp sẽ được lưu trữ an toàn trên đám mây Cloudinary.</div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                            <a th:href="@{/student/dashboard}" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold">
                                <i class="bi bi-send-fill me-1"></i>Gửi Câu Hỏi
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>

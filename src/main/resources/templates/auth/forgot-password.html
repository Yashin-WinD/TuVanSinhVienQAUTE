<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Quên mật khẩu - Cổng tư vấn QAUTE')}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card card-custom p-4 shadow">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock-fill display-4 text-warning"></i>
                        <h3 class="fw-bold mt-2">Quên Mật Khẩu</h3>
                        <p class="text-muted small">Nhập email tài khoản của bạn để nhận mã OTP đặt lại mật khẩu</p>
                    </div>

                    <!-- Flash messages -->
                    <div th:if="${errorMessage != null}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage != null}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                    <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email tài khoản</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="vd: sinhvien@ute.udn.vn" required autofocus>
                            </div>
                            <div class="form-text small text-muted">
                                Hệ thống sẽ gửi mã xác thực 6 số đến email này (hoặc hiển thị tại Terminal khi chạy cục bộ).
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark">
                            <i class="bi bi-send-fill me-2"></i>Gửi Mã OTP
                        </button>
                    </form>

                    <div class="text-center mt-4 small">
                        Nhớ mật khẩu rồi? <a th:href="@{/login}" class="fw-bold text-decoration-none">Quay lại Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>

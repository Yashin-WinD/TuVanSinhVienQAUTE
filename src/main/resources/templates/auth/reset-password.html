<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đặt lại mật khẩu - Cổng tư vấn QAUTE')}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card card-custom p-4 shadow">
                    <div class="text-center mb-4">
                        <i class="bi bi-key-fill display-4 text-primary"></i>
                        <h3 class="fw-bold mt-2">Đặt Lại Mật Khẩu</h3>
                        <p class="text-muted small">Nhập mã OTP vừa nhận cùng với mật khẩu mới của bạn</p>
                    </div>

                    <!-- Flash messages -->
                    <div th:if="${errorMessage != null}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
                    <div th:if="${successMessage != null}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                    <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post">
                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email tài khoản</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="resetEmail" th:field="*{email}" placeholder="Email của bạn" required readonly>
                            </div>
                        </div>

                        <!-- Mã OTP và nút gửi lại -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mã xác thực OTP (6 chữ số)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                <input type="text" class="form-control text-center fw-bold letter-spacing-1" th:field="*{otp}" placeholder="123456" maxlength="6" required autofocus>
                                <button type="button" class="btn btn-outline-secondary" id="btnResendOtp" onclick="resendOtp()">
                                    <i class="bi bi-arrow-repeat me-1"></i>Gửi lại
                                </button>
                            </div>
                            <div id="resendAlert" class="small mt-1 d-none"></div>
                        </div>

                        <!-- Mật khẩu mới -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" th:field="*{newPassword}" placeholder="Tối thiểu 6 ký tự" required>
                            </div>
                        </div>

                        <!-- Xác nhận mật khẩu mới -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="bi bi-check-circle-fill me-2"></i>Lưu Mật Khẩu Mới
                        </button>
                    </form>

                    <div class="text-center mt-3 small">
                        <a th:href="@{/login}" class="fw-bold text-decoration-none">Quay lại Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>

    <script>
        function resendOtp() {
            const emailInput = document.getElementById('resetEmail');
            const email = emailInput ? emailInput.value.trim() : '';
            const btnResend = document.getElementById('btnResendOtp');
            const alertBox = document.getElementById('resendAlert');

            if (!email) {
                alert('Không tìm thấy email cần gửi lại OTP!');
                return;
            }

            btnResend.disabled = true;
            btnResend.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>';

            fetch('/api/v1/auth/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, purpose: 'FORGOT_PASSWORD' })
            })
            .then(async res => {
                const data = await res.json();
                if (res.ok) {
                    alertBox.className = 'small mt-1 text-success fw-semibold';
                    alertBox.textContent = '✓ Mã OTP mới đã được gửi (kiểm tra Terminal nếu test cục bộ)!';
                    alertBox.classList.remove('d-none');
                    startCooldown(btnResend, 60);
                } else {
                    alertBox.className = 'small mt-1 text-danger fw-semibold';
                    alertBox.textContent = '✗ ' + (data.message || 'Lỗi gửi lại OTP');
                    alertBox.classList.remove('d-none');
                    btnResend.disabled = false;
                    btnResend.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Gửi lại';
                }
            })
            .catch(err => {
                alertBox.className = 'small mt-1 text-danger fw-semibold';
                alertBox.textContent = '✗ Lỗi kết nối máy chủ';
                alertBox.classList.remove('d-none');
                btnResend.disabled = false;
                btnResend.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Gửi lại';
            });
        }

        function startCooldown(button, seconds) {
            let countdown = seconds;
            const interval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    button.disabled = true;
                    button.innerHTML = `(${countdown}s)`;
                } else {
                    clearInterval(interval);
                    button.disabled = false;
                    button.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Gửi lại';
                }
            }, 1000);
        }
    </script>
</body>
</html>
